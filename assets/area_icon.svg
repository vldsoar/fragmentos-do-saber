<svg
    width="96"
    height="96"
    viewBox="0 0 64 64"
    fill="none"
    xmlns="http://www.w3.org/2000/svg">

    <!-- Fundo arredondado (pode virar a cor do tema) -->
    <defs>
        <linearGradient id="bgGradient" x1="12" y1="8" x2="52" y2="56" gradientUnits="userSpaceOnUse">
            <stop stop-color="#14213D"/>
            <stop offset="1" stop-color="#23395B"/>
        </linearGradient>
    </defs>

    <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#bgGradient)"/>

    <!-- Círculo de destaque central -->
    <circle cx="32" cy="32" r="20" fill="#0D182C" opacity="0.9"/>
    <circle cx="32" cy="32" r="20" stroke="#F4E3C3" stroke-width="1.5" opacity="0.9"/>

    <!-- "Abas" laterais representando outras áreas de conhecimento -->
    <!-- Aba esquerda -->
    <rect x="18" y="22" width="8" height="20" rx="2.5"
          fill="#1B314F" stroke="#F4E3C3" stroke-width="1"/>
    <!-- Aba direita -->
    <rect x="38" y="22" width="8" height="20" rx="2.5"
          fill="#1B314F" stroke="#F4E3C3" stroke-width="1"/>

    <!-- Card central (representa a área escolhida) -->
    <rect x="24" y="20" width="16" height="24" rx="3"
          fill="#F4E3C3" stroke="#F5B700" stroke-width="1.5"/>

    <!-- “Título” do card -->
    <rect x="27" y="23" width="10" height="3" rx="1.5" fill="#C59D6F" opacity="0.9"/>

    <!-- Linhas de texto simbólicas -->
    <rect x="27" y="28" width="10" height="2" rx="1" fill="#C59D6F" opacity="0.7"/>
    <rect x="27" y="32" width="10" height="2" rx="1" fill="#C59D6F" opacity="0.7"/>
    <rect x="27" y="36" width="8" height="2" rx="1" fill="#C59D6F" opacity="0.7"/>

    <!-- Pequeno “brilho” para sensação mágica/erudita -->
    <circle cx="22" cy="18" r="1.5" fill="#F5B700"/>
    <circle cx="42" cy="18" r="1.2" fill="#F5B700"/>
    <circle cx="32" cy="46" r="1.2" fill="#F5B700"/>

    <!-- Pequena estrela -->
    <path d="M32 16 L33 18 L35 18.2 L33.7 19.5 L34 21.5 L32 20.6 L30 21.5 L30.3 19.5 L29 18.2 L31 18 Z"
          fill="#F5B700"/>
</svg>
